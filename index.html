              '</div>' +
            '</div>' +

            '<div class="g-12-md">' +
              '<div class="col-5-md card space-y-3">' +
                '<div class="flex items-center justify-between"><div class="flex items-center gap-2"><span class="c-teal">' + icon('terminal', 16) + '</span><h3 class="h4">ESP32 Serial Monitor (115200 Baud)</h3></div>' +
                  '<div class="flex gap-1_5"><button type="button" id="esp-toggle-btn" class="btn ' + (S.esp32ConsoleActive ? 'btn-amber' : 'btn-emerald') + '">' + (S.esp32ConsoleActive ? 'Pause' : 'Resume') + '</button><button type="button" id="esp-clear-btn" class="btn">Clear</button></div>' +
                '</div>' +
                '<div id="esp32-console-body" class="card-dark font-mono txt-11 overflow-y-auto space-y-1" style="height:280px;line-height:1.5"></div>' +
              '</div>' +
              '<div class="col-7-md code-box">' +
                '<div class="code-head flex-wrap">' +
                  '<div class="seg-group">' +
                    '<button type="button" class="seg-btn' + (S.esp32CodeTab === 'settimino' ? ' active' : '') + '" data-ec="settimino">1. Settimino (S7comm)</button>' +
                    '<button type="button" class="seg-btn' + (S.esp32CodeTab === 'modbus' ? ' active' : '') + '" data-ec="modbus">2. Modbus TCP</button>' +
                    '<button type="button" class="seg-btn' + (S.esp32CodeTab === 'mqtt' ? ' active' : '') + '" data-ec="mqtt">3. MQTT Cloud</button>' +
                  '</div>' +
                  '<button type="button" id="btn-copy-esp" class="btn btn-primary">' + icon('copy', 13) + '<span id="lbl-copy-esp">Sao chép C++</span></button>' +
                '</div>' +
                '<pre class="code-pre" style="max-height:290px"><code>' + esc(codeText) + '</code></pre>' +
              '</div>' +
            '</div>' +

            '<div class="g-2">' +
              '<div class="card space-y-1_5"><h4 class="h4 c-amber">Bắt buộc 1: Bật PUT/GET Communication</h4><p class="txt-xs c-muted" style="margin:0;line-height:1.6">Trong TIA Portal -> Properties của CPU 1214C -> Protection &amp; Security -> Connection mechanisms -> Tick chọn <strong>"Permit access with PUT/GET communication from remote partner"</strong> rồi biên dịch &amp; download lại xuống PLC.</p></div>' +
              '<div class="card space-y-1_5"><h4 class="h4 c-amber">Bắt buộc 2: Tắt Optimized Block Access (Nếu đọc DB)</h4><p class="txt-xs c-muted" style="margin:0;line-height:1.6">Nếu ESP32 đọc dữ liệu trong Data Block (DB1) thay vì vùng M, click chuột phải vào DB -> Properties -> Attributes -> Bỏ tick <strong>Optimized block access</strong> để hiển thị cột Offset (0.0, 4.0, 8.0...).</p></div>' +
            '</div>';

          document.getElementById('esp-toggle-btn').onclick = function () {
            S.esp32ConsoleActive = !S.esp32ConsoleActive;
            renderESP32View();
          };
          document.getElementById('esp-clear-btn').onclick = function () {
            S.esp32Logs = [];
            updateESP32ConsoleUI();
          };
          root.querySelectorAll('[data-ec]').forEach(function (b) {
            b.onclick = function () {
              S.esp32CodeTab = b.getAttribute('data-ec');
              renderESP32View();
            };
          });
          document.getElementById('btn-copy-esp').onclick = function () {
            copyText(ESP32_CODES[S.esp32CodeTab], function () {
              var l = document.getElementById('lbl-copy-esp');
              if (l) l.textContent = 'Đã chép C++!';
              setTimeout(function () { if (l) l.textContent = 'Sao chép C++'; }, 2000);
            });
          };
          updateESP32ConsoleUI();
        }

        // =========================================================================
        // MASTER NAVIGATION, REFRESH & INIT
        // =========================================================================
        var CONTEXT_TITLES = {
          simulation: 'Bàn thực hành Mô phỏng PLC Tổng thể (Tasks 1–10)',
          tasks: 'Chi tiết 10 Bài tập Lab 3 · LAD/SCL, Giải thích Lý thuyết &amp; Mô phỏng',
          hmi: 'Thiết kế Giao diện WinCC HMI KTP700 &amp; Kết nối S7-PLCSIM',
          esp32: 'Truyền dữ liệu PLC S7-1200 Online sang ESP32 &amp; MQTT IoT Cloud'
        };

        function switchMainTab(tab) {
          S.activeTab = tab;
          ['simulation', 'tasks', 'hmi', 'esp32'].forEach(function (k) {
            var sec = document.getElementById('view-' + k);
            if (sec) sec.classList.toggle('hidden', k !== tab);
          });
          document.querySelectorAll('[data-nav]').forEach(function (btn) {
            btn.classList.toggle('active', btn.getAttribute('data-nav') === tab);
          });
          var ctx = document.getElementById('context-bar-title');
          if (ctx) ctx.innerHTML = CONTEXT_TITLES[tab] || CONTEXT_TITLES.simulation;

          if (tab === 'simulation') renderSimulationView();
          else if (tab === 'tasks') renderTasksView();
          else if (tab === 'hmi') renderHMIView();
          else if (tab === 'esp32') renderESP32View();

          updateDynamic();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateDynamic() {
          if (S.activeTab === 'simulation') updateSimulationDynamic();
          else if (S.activeTab === 'tasks') updateTasksDynamic();
          else if (S.activeTab === 'hmi') updateHMIDynamic();
        }

        function init() {
          // Inject brand & rubric button icons
          var bIc = document.getElementById('brand-icon');
          var rIc = document.getElementById('rubric-icon');
          if (bIc) bIc.innerHTML = icon('cpu', 18);
          if (rIc) rIc.innerHTML = icon('file', 14);

          // Nav bindings
          document.getElementById('brand-home').onclick = function (e) { e.preventDefault(); switchMainTab('simulation'); };
          document.querySelectorAll('[data-nav]').forEach(function (btn) {
            btn.onclick = function () { switchMainTab(btn.getAttribute('data-nav')); };
          });

          function openTags() { S.isTagModalOpen = true; renderTagModal(); }
          function openRubric() { S.isRubricOpen = true; renderRubricModal(); }

          ['btn-open-tags-nav', 'btn-open-tags-mob', 'btn-open-tags-foot'].forEach(function (id) {
            var el = document.getElementById(id);
            if (el) el.onclick = openTags;
          });
          ['btn-open-rubric', 'btn-open-rubric-foot'].forEach(function (id) {
            var el = document.getElementById(id);
            if (el) el.onclick = openRubric;
          });

          document.getElementById('modal-tags').onclick = function (e) { if (e.target.id === 'modal-tags') closeTags(); };
          document.getElementById('modal-rubric').onclick = function (e) { if (e.target.id === 'modal-rubric') closeRubric(); };

          recomputeDerived(true);
          renderSimulationView();
          updateDynamic();
        }

        init();
      })();
    </script>
  </body>
</html>
