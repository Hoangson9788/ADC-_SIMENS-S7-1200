<html lang="vi">

    <meta property="og:description" content="Hướng dẫn giải chi tiết, mã nguồn TIA Portal (LAD & SCL), sơ đồ đấu dây và mô phỏng tương tác cho Lab 3: Xử lý tín hiệu tương tự trên PLC Siemens S7-1200." />
    <meta property="og:type" content="website" />
    <style>
      :root {
        --bg-0: #020617;
        --bg-1: #0f172a;
        --bg-2: #1e293b;
        --border: #1e293b;
        --border-2: #334155;
        --text: #f1f5f9;
        --text-muted: #94a3b8;
        --text-dim: #64748b;
        --teal: #2dd4bf;
        --teal-solid: #14b8a6;
        --cyan: #22d3ee;
        --emerald: #34d399;
        --amber: #fbbf24;
        --rose: #fb7185;
        --sky: #38bdf8;
        --indigo: #818cf8;
        --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: var(--bg-0); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: hidden; }
      button, input, select { font-family: inherit; color: inherit; }
      button { cursor: pointer; background: none; border: 0; padding: 0; }
      code, pre, .font-mono { font-family: var(--mono); }
      .tabular-nums { font-variant-numeric: tabular-nums; }
      .hidden { display: none !important; }
      .flex { display: flex; }
      .inline-flex { display: inline-flex; }
      .flex-col { flex-direction: column; }
      .flex-wrap { flex-wrap: wrap; }
      .flex-1 { flex: 1 1 0%; min-width: 0; }
      .shrink-0 { flex-shrink: 0; }
      .items-center { align-items: center; }
      .items-start { align-items: flex-start; }
      .items-end { align-items: flex-end; }
      .items-baseline { align-items: baseline; }
      .justify-between { justify-content: space-between; }
      .justify-center { justify-content: center; }
      .justify-end { justify-content: flex-end; }
      .grid { display: grid; }
      .gap-1 { gap: 4px; }
      .gap-1_5 { gap: 6px; }
      .gap-2 { gap: 8px; }
      .gap-2_5 { gap: 10px; }
      .gap-3 { gap: 12px; }
      .gap-4 { gap: 16px; }
      .gap-5 { gap: 20px; }
      .gap-6 { gap: 24px; }
      .w-full { width: 100%; }
      .min-w-0 { min-width: 0; }
      .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .nowrap { white-space: nowrap; }
      .overflow-x-auto { overflow-x: auto; }
      .overflow-y-auto { overflow-y: auto; }
      .overflow-hidden { overflow: hidden; }
      .relative { position: relative; }

      .space-y-1 > * + * { margin-top: 4px; }
      .space-y-1_5 > * + * { margin-top: 6px; }
      .space-y-2 > * + * { margin-top: 8px; }
      .space-y-2_5 > * + * { margin-top: 10px; }
      .space-y-3 > * + * { margin-top: 12px; }
      .space-y-4 > * + * { margin-top: 16px; }
      .space-y-5 > * + * { margin-top: 20px; }
      .space-y-6 > * + * { margin-top: 24px; }

      .app-shell { min-height: 100vh; display: flex; flex-direction: column; }
      .container { max-width: 1280px; width: 100%; margin: 0 auto; }
      .topbar { position: sticky; top: 0; z-index: 40; background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 14px 16px; }
      .brand { font-size: 16px; font-weight: 700; color: #fff; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; }
      .brand-badge { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #10b981, #0f766e); display: inline-flex; align-items: center; justify-content: center; color: #fff; box-shadow: 0 6px 16px rgba(20,184,166,.25); }
      .nav-desktop { display: none; align-items: center; gap: 22px; font-size: 14px; font-weight: 500; }
      .nav-btn { color: var(--text-muted); padding: 4px 0; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; white-space: nowrap; }
      .nav-btn:hover { color: #fff; }
      .nav-btn.active { color: var(--teal); border-bottom-color: var(--teal); font-weight: 600; }
      .btn-rubric { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; font-size: 12px; font-weight: 700; color: #0f172a; background: #2dd4bf; border-radius: 8px; white-space: nowrap; }
      .btn-rubric:hover { background: #5eead4; }

      .main-wrap { flex: 1; max-width: 1280px; width: 100%; margin: 0 auto; padding: 16px; }
      @media (min-width: 640px) { .main-wrap { padding: 24px; } }
      @media (min-width: 768px) {
        .topbar { padding: 14px 32px; }
        .nav-desktop { display: flex; }
        .mobile-tabs { display: none !important; }
        .context-bar { display: flex !important; }
      }
      @media (min-width: 1024px) { .main-wrap { padding: 32px; } }

      .mobile-tabs { display: flex; align-items: center; gap: 6px; padding: 4px; background: var(--bg-1); border: 1px solid var(--border); border-radius: 12px; font-size: 12px; overflow-x: auto; }
      .mob-tab { padding: 6px 12px; border-radius: 8px; font-weight: 500; color: var(--text-muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
      .mob-tab.active { background: var(--teal-solid); color: var(--bg-0); font-weight: 700; }
      .context-bar { display: none; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px; font-size: 12px; color: var(--text-muted); }

      /* Responsive Grids */
      .g-2 { display: grid; grid-template-columns: 1fr; gap: 16px; }
      .g-3 { display: grid; grid-template-columns: 1fr; gap: 12px; }
      .g-4 { display: grid; grid-template-columns: 1fr; gap: 12px; }
      .g-6 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .g-leds { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .g-workbench { display: grid; grid-template-columns: 1fr; gap: 24px; }
      @media (min-width: 640px) {
        .g-2-sm { grid-template-columns: repeat(2, 1fr); }
        .g-3-sm { grid-template-columns: repeat(3, 1fr); }
        .g-4-sm { grid-template-columns: repeat(2, 1fr); }
        .g-6 { grid-template-columns: repeat(6, 1fr); }
        .g-leds { grid-template-columns: repeat(4, 1fr); }
        .g-fkeys { grid-template-columns: repeat(4, 1fr) !important; }
      }
      @media (min-width: 768px) {
        .g-2 { grid-template-columns: repeat(2, 1fr); }
        .g-3 { grid-template-columns: repeat(3, 1fr); }
        .g-12-md { display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; }
        .col-5-md { grid-column: span 5; }
        .col-6-md { grid-column: span 6; }
        .col-7-md { grid-column: span 7; }
      }
      @media (min-width: 1024px) {
        .g-4 { grid-template-columns: repeat(4, 1fr); }
        .g-leds { grid-template-columns: repeat(7, 1fr); }
        .g-workbench { grid-template-columns: repeat(12, 1fr); }
        .col-5-lg { grid-column: span 5; }
        .col-6-lg { grid-column: span 6; }
        .col-7-lg { grid-column: span 7; }
      }
      @media (min-width: 1280px) {
        .g-hmi { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; align-items: start; }
        .col-7-xl { grid-column: span 7; }
        .col-5-xl { grid-column: span 5; }
      }
      @media (max-width: 1279px) {
        .g-hmi { display: grid; grid-template-columns: 1fr; gap: 24px; }
      }

      /* Surfaces & Cards */
      .card { background: var(--bg-1); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,.25); }
      .card-dark { background: var(--bg-0); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
      .card-sm { background: var(--bg-0); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
      .divider-b { border-bottom: 1px solid var(--border); padding-bottom: 14px; }
      .divider-t { border-top: 1px solid var(--border); padding-top: 14px; }

      /* Typography & Colors */
      .h2 { font-size: 18px; font-weight: 700; color: #fff; margin: 0; }
      .h3 { font-size: 16px; font-weight: 700; color: #fff; margin: 0; }
      .h4 { font-size: 14px; font-weight: 700; color: #fff; margin: 0; }
      .txt-xs { font-size: 12px; }
      .txt-11 { font-size: 11px; }
      .txt-10 { font-size: 10px; }
      .txt-sm { font-size: 14px; }
      .c-muted { color: var(--text-muted); }
      .c-dim { color: var(--text-dim); }
      .c-teal { color: var(--teal); }
      .c-cyan { color: var(--cyan); }
      .c-emerald { color: var(--emerald); }
      .c-amber { color: var(--amber); }
      .c-rose { color: var(--rose); }
      .c-sky { color: var(--sky); }
      .c-indigo { color: var(--indigo); }
      .c-white { color: #fff; }
      .fw-bold { font-weight: 700; }
      .fw-semi { font-weight: 600; }

      /* Pills, Badges, Buttons */
      .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 8px; font-size: 11px; font-family: var(--mono); font-weight: 700; border: 1px solid var(--border-2); background: var(--bg-0); color: var(--text-muted); }
      .badge-teal { background: rgba(20,184,166,.15); border-color: rgba(45,212,191,.4); color: #5eead4; }
      .badge-emerald { background: rgba(6,78,59,.55); border-color: rgba(52,211,153,.5); color: #6ee7b7; }
      .badge-amber { background: rgba(120,53,15,.45); border-color: rgba(251,191,36,.5); color: #fcd34d; }
      .badge-rose { background: rgba(136,19,55,.5); border-color: rgba(244,63,94,.6); color: #fda4af; }
      .badge-sky { background: rgba(12,74,110,.55); border-color: rgba(56,189,248,.5); color: #7dd3fc; }
      .badge-indigo { background: rgba(49,46,129,.5); border-color: rgba(129,140,248,.4); color: #a5b4fc; }

      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; border: 1px solid var(--border-2); background: var(--bg-2); color: #e2e8f0; transition: all .12s; white-space: nowrap; }
      .btn:hover:not(:disabled) { background: #334155; color: #fff; }
      .btn:disabled { opacity: .4; cursor: not-allowed; }
      .btn-primary { background: var(--teal-solid); color: var(--bg-0); border-color: var(--teal); font-weight: 700; }
      .btn-primary:hover:not(:disabled) { background: var(--teal); color: var(--bg-0); }
      .btn-emerald { background: #10b981; color: var(--bg-0); border-color: #34d399; font-weight: 700; }
      .btn-emerald:hover:not(:disabled) { background: #34d399; }
      .btn-sky { background: #0ea5e9; color: var(--bg-0); border-color: #38bdf8; font-weight: 700; }
      .btn-sky:hover:not(:disabled) { background: #38bdf8; }
      .btn-rose { background: rgba(244,63,94,.18); color: #fda4af; border-color: rgba(244,63,94,.45); font-weight: 700; }
      .btn-rose:hover:not(:disabled) { background: rgba(244,63,94,.3); }
      .btn-amber { background: rgba(245,158,11,.18); color: #fcd34d; border-color: rgba(245,158,11,.45); font-weight: 700; }

      .seg-group { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--bg-0); border: 1px solid var(--border); border-radius: 10px; font-size: 12px; }
      .seg-btn { padding: 5px 10px; border-radius: 6px; color: var(--text-muted); font-weight: 600; transition: all .12s; white-space: nowrap; }
      .seg-btn:hover { color: #fff; }
      .seg-btn.active { background: var(--teal-solid); color: var(--bg-0); font-weight: 700; }

      /* Slider */
      input[type="range"] { width: 100%; height: 8px; border-radius: 8px; accent-color: var(--teal); cursor: pointer; background: var(--bg-2); }
      .inp { width: 100%; background: var(--bg-1); border: 1px solid var(--border-2); border-radius: 8px; padding: 7px 11px; font-size: 12px; color: #fff; outline: none; }
      .inp:focus { border-color: var(--teal); }

      /* LED Matrix Cells */
      .led-card { padding: 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-0); color: var(--text-dim); transition: all .15s; }
      .led-card.on-emerald { background: rgba(6,78,59,.4); border-color: rgba(16,185,129,.55); color: #6ee7b7; }
      .led-card.on-rose { background: rgba(136,19,55,.55); border-color: #f43f5e; color: #fda4af; }
      .led-card.on-amber { background: rgba(120,53,15,.45); border-color: rgba(245,158,11,.6); color: #fcd34d; }
      .led-card.on-blue { background: rgba(30,58,138,.45); border-color: rgba(59,130,246,.6); color: #93c5fd; }
      .led-card.on-sky { background: rgba(12,74,110,.5); border-color: #38bdf8; color: #7dd3fc; }
      .led-card.on-red { background: rgba(127,29,29,.5); border-color: #f87171; color: #fca5a5; }
      .dot { width: 9px; height: 9px; border-radius: 999px; background: #334155; display: inline-block; shrink: 0; }
      .dot.emerald { background: #34d399; box-shadow: 0 0 8px rgba(52,211,153,.7); }
      .dot.cyan { background: #22d3ee; box-shadow: 0 0 8px rgba(34,211,238,.7); }
      .dot.rose { background: #fb7185; box-shadow: 0 0 8px rgba(251,113,133,.8); }
      .dot.amber { background: #fbbf24; box-shadow: 0 0 8px rgba(251,191,36,.7); }
      .dot.blue { background: #60a5fa; box-shadow: 0 0 8px rgba(96,165,250,.7); }
      .dot.sky { background: #38bdf8; box-shadow: 0 0 8px rgba(56,189,248,.7); }
      .dot.red { background: #f87171; box-shadow: 0 0 8px rgba(248,113,113,.7); }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
      .animate-pulse { animation: pulse 1.2s ease-in-out infinite; }

      /* Tables */
      .tbl-wrap { border: 1px solid var(--border); border-radius: 12px; background: var(--bg-0); overflow-x: auto; }
      .tbl { width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; }
      .tbl th { background: var(--bg-1); color: var(--text-muted); font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
      .tbl td { padding: 7px 12px; border-bottom: 1px solid rgba(30,41,59,.6); vertical-align: middle; }
      .tbl tr:last-child td { border-bottom: 0; }
      .tbl tr:hover td { background: rgba(15,23,42,.55); }
      .tbl tr.row-alarm td { background: rgba(136,19,55,.28); color: #fecdd3; }

      /* Task strip & Task cards */
      .task-pill { padding: 7px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-1); color: var(--text-muted); font-family: var(--mono); font-size: 12px; font-weight: 700; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; transition: all .12s; }
      .task-pill:hover { color: #fff; border-color: var(--border-2); }
      .task-pill.active { background: var(--teal-solid); color: var(--bg-0); border-color: var(--teal); box-shadow: 0 4px 12px rgba(20,184,166,.25); }
      .task-card { padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(2,6,23,.85); color: #cbd5e1; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 12px; transition: all .12s; width: 100%; }
      .task-card:hover { background: var(--bg-1); border-color: var(--border-2); }
      .task-card.active { background: rgba(20,184,166,.13); border-color: var(--teal); box-shadow: inset 0 0 0 1px var(--teal); }
      .task-num { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-1); color: #5eead4; font-family: var(--mono); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
      .task-card.active .task-num { background: var(--teal-solid); color: var(--bg-0); border-color: var(--teal); }

      /* Subtabs inside TaskDetail */
      .subtab { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 12px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--bg-0); color: var(--text-muted); border: 1px solid var(--border); }
      .subtab:hover { color: #fff; }
      .subtab.active { background: var(--teal-solid); color: var(--bg-0); border-color: var(--teal); font-weight: 700; }

      /* Code Pre */
      .code-box { background: var(--bg-0); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
      .code-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: var(--bg-1); border-bottom: 1px solid var(--border); }
      .code-pre { margin: 0; padding: 16px; font-family: var(--mono); font-size: 12px; line-height: 1.65; color: #99f6e4; overflow-x: auto; max-height: 440px; overflow-y: auto; white-space: pre; }

      /* Ladder Diagram (TIA Portal Visual Styling) */
      .lad-wrap { background: var(--bg-0); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
      .lad-net { border: 1px solid var(--border); border-radius: 12px; background: rgba(15,23,42,.5); overflow: hidden; }
      .lad-net-head { padding: 8px 14px; background: var(--bg-1); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; }
      .lad-rungs { padding: 14px; overflow-x: auto; background: rgba(2,6,23,.75); }
      .lad-rung { display: flex; align-items: center; min-width: max-content; padding: 4px 0; }
      .lad-rail { width: 4px; align-self: stretch; min-height: 40px; border-radius: 2px; background: #64748b; flex-shrink: 0; }
      .lad-rail.on { background: #34d399; }
      .lad-rail-r { width: 4px; align-self: stretch; min-height: 40px; border-radius: 2px; background: #334155; flex-shrink: 0; }
      .lad-wire { height: 2px; width: 20px; background: #475569; flex-shrink: 0; }
      .lad-wire.sm { width: 10px; }
      .lad-wire.full { width: 100%; min-width: 20px; }
      .lad-wire.on { background: #34d399; box-shadow: 0 0 6px rgba(52,211,153,.7); }
      .lad-contact { display: flex; flex-direction: column; align-items: center; min-width: 78px; flex-shrink: 0; }
      .lad-contact-box { padding: 4px 8px; border-left: 2px solid #94a3b8; border-right: 2px solid #94a3b8; font-family: var(--mono); font-size: 12px; font-weight: 700; line-height: 1; color: #cbd5e1; }
      .lad-contact-box.closed { border-color: rgba(16,185,129,.65); color: #34d399; }
      .lad-contact-box.hot { border-color: #34d399; color: #6ee7b7; background: rgba(16,185,129,.12); }
      .lad-cmp { border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; font-family: var(--mono); font-size: 10px; background: var(--bg-1); min-width: 112px; flex-shrink: 0; }
      .lad-cmp.hot { border-color: #34d399; box-shadow: 0 0 10px rgba(52,211,153,.18); }
      .lad-coil { display: flex; flex-direction: column; align-items: center; min-width: 82px; flex-shrink: 0; }
      .lad-coil-sym { padding: 3px 9px; border-radius: 999px; border: 1px solid #64748b; background: var(--bg-1); font-family: var(--mono); font-size: 12px; font-weight: 700; color: #94a3b8; white-space: nowrap; }
      .lad-coil-sym.hot { border-color: #34d399; background: rgba(16,185,129,.2); color: #6ee7b7; box-shadow: 0 0 8px rgba(52,211,153,.45); }
      .lad-box { border: 1px solid #334155; border-radius: 8px; background: var(--bg-1); min-width: 215px; font-family: var(--mono); font-size: 10px; overflow: hidden; flex-shrink: 0; }
      .lad-box.hot { border-color: #34d399; box-shadow: 0 0 12px rgba(52,211,153,.18); }
      .lad-box-head { padding: 4px 10px; border-bottom: 1px solid #334155; background: rgba(30,41,59,.8); display: flex; justify-content: space-between; font-weight: 700; color: #5eead4; }
      .lad-box.hot .lad-box-head { background: rgba(6,78,59,.55); border-bottom-color: rgba(16,185,129,.4); color: #6ee7b7; }
      .lad-branch { display: flex; flex-direction: column; gap: 8px; border-left: 2px solid #475569; border-right: 2px solid #475569; padding: 8px 10px; border-radius: 3px; background: rgba(15,23,42,.4); flex-shrink: 0; }

      /* Stacked Mathematical Fractions */
      .formula-card { margin: 8px 0; padding: 12px 16px; border-radius: 12px; background: var(--bg-1); border: 1px solid rgba(20,184,166,.35); font-family: var(--mono); font-size: 13px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; overflow-x: auto; }
      .math-frac { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; vertical-align: middle; padding: 0 6px; margin: 0 2px; }
      .math-num { color: #5eead4; font-weight: 700; padding: 0 4px 2px; border-bottom: 1px solid rgba(45,212,191,.7); white-space: nowrap; }

      /* Hysteresis Axis & Tank */
      .hyst-bar { position: relative; height: 40px; background: var(--bg-0); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }

      .tank-vessel { position: relative; width: 190px; height: 256px; border: 4px solid #475569; border-top: 0; border-radius: 0 0 16px 16px; background: var(--bg-0); overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }

        function icon(name, size) {
          var s = size || 16;
          return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;display:inline-block;vertical-align:middle">' + (ICONS[name] || '') + '</svg>';
        }

        function esc(str) {
          return String(str == null ? '' : str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
        }

        function copyText(text, onDone) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () {
              if (onDone) onDone();
            }).catch(function () {
              fallbackCopy(text, onDone);
            });
          } else {
            fallbackCopy(text, onDone);
          }
        }

        function fallbackCopy(text, onDone) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); } catch (e) {}
          document.body.removeChild(ta);
          if (onDone) onDone();
        }

        function downloadFile(filename, content, mime) {
          var blob = new Blob([content], { type: mime });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }

        // Pure PLC Simulation Engine
        function clampVoltage(v) {
          if (!isFinite(v)) return 0;
          return Math.min(10.0, Math.max(0.0, v));
        }

        function computeAnalogPipeline(vIn) {
          var voltage = clampVoltage(vIn);
          var rawIW64 = Math.round((voltage / 10.0) * 27648);
          var normPct = rawIW64 / 27648;
          var scaleV = normPct * 10.0;
          var engFilt = normPct * 100.0;
          return { voltage: voltage, rawIW64: rawIW64, normPct: normPct, scaleV: scaleV, engFilt: engFilt };
        }

        function rawCountsToVoltage(raw) {
          if (!isFinite(raw)) return 0;
          var c = Math.min(27648, Math.max(0, Math.round(raw)));
          return Math.round(((c / 27648) * 10.0) * 1000) / 1000;
        }

        function evaluateCleanroomHysteresis(engFilt, prev) {
          var hiAlm = prev.hiAlm;
          if (engFilt > 80.0) hiAlm = true;
          else if (engFilt < 78.0) hiAlm = false;
          var loAlm = prev.loAlm;
          if (engFilt < 20.0) loAlm = true;
          else if (engFilt > 22.0) loAlm = false;
          return { hiAlm: hiAlm, loAlm: loAlm };
        }

        function evaluateTankPumpHysteresis(tankLvl, prevPump) {
          if (tankLvl < 30.0) return true;
          if (tankLvl > 70.0) return false;
          return prevPump;
        }

        function evaluateTemperatureZone(tempC) {
          return {
            qCold: tempC < 15.0,
            qNormal: tempC >= 15.0 && tempC <= 30.0,
            qHot: tempC > 30.0
          };
        }

        function computeRoC(curPct, prevPct, tsMs) {
          var tsSec = Math.max(0.001, tsMs / 1000.0);
          var rawRoc = (curPct - prevPct) / tsSec;
          var roc = Math.abs(rawRoc) < 0.2 ? 0 : rawRoc;
          var absRoc = Math.abs(roc);
          return { roc: roc, absRoc: absRoc, shockAlm: absRoc > 30.0 };
        }

        // Formula & Explanation Parser
        function parseFormulaTokens(expr) {
          var tokens = [];
          var re = /\{([^{}]+)\}\s*\/\s*\{([^{}]+)\}/g;
          var last = 0, m;
          while ((m = re.exec(expr)) !== null) {
            if (m.index > last) tokens.push({ kind: 'text', value: expr.slice(last, m.index) });
            tokens.push({ kind: 'fraction', numerator: m[1].trim(), denominator: m[2].trim() });
            last = re.lastIndex;
          }
          if (last < expr.length) tokens.push({ kind: 'text', value: expr.slice(last) });
          return tokens.length ? tokens : [{ kind: 'text', value: expr }];
        }

        function renderExplanationHTML(raw) {
          var lines = String(raw || '').split('\n');
          var html = '<div class="space-y-2_5 txt-xs" style="line-height:1.65;color:#cbd5e1">';
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i];
            var trimmed = line.trim();
            if (!trimmed) continue;
            if (trimmed.indexOf('FORMULA:') === 0) {
              var toks = parseFormulaTokens(trimmed.slice(8).trim());
              html += '<div class="formula-card">';
              for (var j = 0; j < toks.length; j++) {
                var tk = toks[j];
                if (tk.kind === 'text') {
                  html += '<span style="white-space:pre-wrap;color:#f1f5f9;font-weight:600">' + esc(tk.value) + '</span>';
                } else {
                  html += '<span class="math-frac"><span class="math-num">' + esc(tk.numerator) + '</span><span class="math-den">' + esc(tk.denominator) + '</span></span>';
                }
              }
              html += '</div>';
            } else if (trimmed.indexOf('⚠️') === 0) {
              html += '<div style="margin:8px 0;padding:12px 14px;border-radius:12px;background:rgba(120,53,15,.4);border:1px solid rgba(251,191,36,.4);color:#fde68a;display:flex;align-items:flex-start;gap:10px">' +
                '<span class="c-amber" style="margin-top:2px">' + icon('warn', 16) + '</span><span>' + esc(trimmed.replace(/^⚠️\s*/, '')) + '</span></div>';
            } else if (/^\d+\.\s+[A-ZÀ-Ỹ0-9]/.test(trimmed)) {
              html += '<h4 class="h4" style="padding-top:10px;border-bottom:1px solid #1e293b;padding-bottom:6px">' + esc(trimmed) + '</h4>';
            } else if (line.indexOf('  + ') === 0) {
              html += '<div style="display:flex;align-items:flex-start;gap:8px;padding-left:22px"><span class="c-cyan font-mono">+</span><span>' + esc(line.slice(4).trim()) + '</span></div>';
            } else if (trimmed.indexOf('- ') === 0) {
              html += '<div style="display:flex;align-items:flex-start;gap:8px;padding-left:4px"><span class="c-teal fw-bold">•</span><span>' + esc(trimmed.slice(2).trim()) + '</span></div>';
            } else if (trimmed.slice(-1) === ':' && trimmed === trimmed.toUpperCase()) {
              html += '<div class="c-teal fw-bold" style="font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding-top:4px">' + esc(trimmed) + '</div>';
            } else {
              html += '<p style="margin:0">' + esc(trimmed) + '</p>';
            }
          }
          return html + '</div>';
        }

        // Ladder Flow Evaluator
        function evaluateElementFlow(el, s, powerIn) {
          if (!powerIn) return false;
          if (el.kind === 'contact' || el.kind === 'compare') return !!el.active(s);
          if (el.kind === 'coil') return powerIn;
          if (el.kind === 'branch') return el.branches.some(function (b) { return evaluateRungFlow(b, s, powerIn); });
          if (el.kind === 'box') return el.active ? !!el.active(s) : powerIn;
          return powerIn;
        }

        function evaluateRungFlow(elements, s, initPow) {
          var p = initPow === undefined ? true : initPow;

        }

          function renderEl(el) {

            if (el.kind === 'compare') return el.op === 'IN_RANGE' ? '[ IN_RANGE: ' + el.in1 + ' <= ' + el.in2 + ' <= ' + el.in3 + ' (' + el.dataType + ') ]' : '[ CMP ' + el.op + ' (' + el.dataType + '): ' + el.in1 + ' ' + el.op + ' ' + el.in2 + ' ]';

            if (el.kind === 'branch') return '(' + el.branches.map(function (b) { return b.map(renderEl).join(' -- '); }).join('  ||  ') + ')';
            var pins = el.inputs.map(function (i) { return i.pin + ':=' + i.label; }).join(', ');
            var outs = el.outputs.map(function (o) { return o.pin + '=>' + o.label; }).join(', ');
            var aux = el.auxInputs ? el.auxInputs.map(function (a) { return '; ' + a.pin + ': ' + a.elements.map(renderEl).join(' -- '); }).join('') : '';
            return '[ ' + el.instruction + (el.subLabel ? ' (' + el.subLabel + ')' : '') + ' | ' + pins + aux + ' | ' + outs + ' ]';
          }
          program.networks.forEach(function (net) {

            explanationVi: "GIẢI THÍCH CHI TIẾT TỪNG CÂU HỎI THEO TIÊU CHUẨN SIEMENS:\n\n1. DẠNG TÍN HIỆU ANALOG TÍCH HỢP:\n- Các dòng CPU S7-1200 tiêu chuẩn (như CPU 1211C, 1212C, 1214C, 1215C, 1217C) đều có sẵn 2 ngõ vào analog onboard loại Voltage 0–10 VDC.\n- Kiểu đấu nối là Single-ended (áp một đầu so với đất chung 2M). Điện trở ngõ vào rất lớn (khoảng 100 kΩ), giúp việc trích dòng đo gần như bằng 0, không gây sụt áp nguồn phát.\n\n2. ĐỊA CHỈ VÀ SỐ LƯỢNG KÊNH:\n- Số lượng kênh: Luôn là 2 kênh.\n- Địa chỉ mặc định trong bảng ký hiệu PLC:\n  + AI 0 = %IW64 (Input Word 64, chiếm 2 byte IB64 và IB65).\n  + AI 1 = %IW66 (Input Word 66, chiếm 2 byte IB66 và IB67).\n\n3. ĐỘ PHÂN GIẢI (RESOLUTION) VÀ CON SỐ 27648 CỦA SIEMENS:\n- Bộ chuyển đổi tương tự - số (ADC) onboard có độ phân giải phần cứng 10-bit, tức là chia dải 0–10V thành 2¹⁰ = 1024 mức lượng tử.\n- Tuy nhiên, Siemens chuẩn hóa toàn bộ các dòng PLC (S7-300, S7-400, S7-1200, S7-1500) trên một dải số nguyên thống nhất: Dải đo danh định (Nominal range 0–100%) luôn được biểu diễn từ 0 đến 27648 (16-bit INT).\n- Giá trị 27648 tương đương với 100% tín hiệu vào (10 V đối với ngõ vào áp).\n- Độ nhạy bước nhảy:\nFORMULA: ΔV = {10 V} / {27648} ≈ 0.3617 mV/đơn vị raw\n- Dải từ 27649 đến 32511 là dải quá tầm (Overshoot / Overrange), và ≥ 32767 báo lỗi tràn (Overflow).\n\n4. TÍNH TOÁN VỚI ĐIỆN ÁP 5 V:\nFORMULA: Tỷ lệ dải đo = {5 V - 0 V} / {10 V - 0 V} = 0.5 = 50%\n- Giá trị số nguyên thô đọc được:\nFORMULA: AI0_RAW = 0.5 × 27648 = 13824\n- Trong thực tế thí nghiệm do sai số biến trở và điện trở dây, giá trị hiển thị sẽ dao động quanh khoảng 13,750 – 13,850 (đề bài ghi xấp xỉ 13,800).",

            explanationVi: "1. NGUYÊN LÝ HOẠT ĐỘNG CỦA KHỐI NORM_X:\n- Khối NORM_X (Normalize) thực hiện phép ánh xạ tuyến tính chuẩn hóa giá trị đầu vào vào khoảng từ 0.0 đến 1.0.\n- Công thức giải thuật được thực thi bên trong hệ điều hành CPU:\nFORMULA: OUT = {VALUE - MIN} / {MAX - MIN}\n- Thay số vào bài toán (MIN = 0, MAX = 27648):\nFORMULA: AI0_PCT = {AI0_RAW - 0} / {27648 - 0} = {AI0_RAW} / {27648}\n- Với ngõ ra là kiểu REAL (số thực dấu chấm động 32-bit theo chuẩn IEEE 754), kết quả trả về luôn nằm trong khoảng [0.0, 1.0] đối với tín hiệu danh định.\n\n2. TẠI SAO CẦN CHUẨN HÓA (NORM_X)?\n- Tách rời hoàn toàn phần cứng khỏi phần mềm ứng dụng: Phần cứng đọc về một số nguyên trừu tượng (0..27648), thông qua chuẩn hóa ta thu được một tỷ lệ phần trăm (0.0 = 0%, 1.0 = 100%).\n- Tạo bước đệm tiêu chuẩn để sau đó có thể đưa vào khối SCALE_X chuyển đổi sang bất kỳ đơn vị vật lý nào (như nhiệt độ °C, áp suất bar, mức nước mét, phần trăm %) một cách linh hoạt.\n\n3. KIỂM CHỨNG TRÊN WATCH TABLE:\n- Tại 0 V: AI0_RAW = 0 → AI0_PCT = 0 / 27648 = 0.0\n- Tại 5 V: AI0_RAW = 13824 → AI0_PCT = 13824 / 27648 = 0.50 (thỏa mãn yêu cầu sai số ±0.02)\n- Tại 10 V: AI0_RAW = 27648 → AI0_PCT = 27648 / 27648 = 1.0",

            explanationVi: "1. HIỆN TƯỢNG FLICKERING (NHẤP NHÁY TIẾP ĐIỂM) VÀ NGUYÊN LÝ TRỄ (HYSTERESIS):\n- Trong môi trường công nghiệp thực tế (như kiểm soát chênh áp phòng sạch Cleanroom), tín hiệu cảm biến luôn có một biên độ nhiễu điện từ hoặc dao động áp suất nhỏ (khoảng ±0.2% đến ±0.5%).\n- Nếu lập trình so sánh đơn giản không có trễ:\n  + Khi áp suất ở mức 80.0%, do nhiễu giá trị sẽ dao động liên tục: 79.9% → 80.1% → 79.9% → 80.1%.\n  + Đèn báo hoặc cuộn hút rơ-le còi báo động sẽ đóng/ngắt liên tục hàng chục lần trong một giây (hiện tượng Chattering/Flickering).\n  + Hậu quả: Gây hồ quang cháy tiếp điểm rơ-le, phát tiếng ồn rẹt rẹt khó chịu và làm giảm tuổi thọ thiết bị.\n\n2. CƠ CHẾ VÙNG TRỄ 2% (DEADBAND):\nFORMULA: HiAlm: Set khi X > 80.0% · Reset khi X < 78.0%  (Deadband = 2.0%)\nFORMULA: LoAlm: Set khi X < 20.0% · Reset khi X > 22.0%  (Deadband = 2.0%)\n- Với Hi Alarm:\n  + Khi giá trị tăng từ dưới lên: Phải vượt qua hẳn ngưỡng trên 80.0% thì mới kích hoạt bật đèn (HiAlm = 1).\n  + Khi tín hiệu giảm xuống: Cho dù tụt về 79.5% đèn vẫn duy trì BẬT. Chỉ khi tín hiệu tụt hẳn xuống dưới 78.0% (tức là 80% - 2%) thì cờ cảnh báo mới được RESET về 0.\n- Với Lo Alarm:\n  + Khi giá trị giảm: Tụt hẳn dưới 20.0% thì BẬT (LoAlm = 1).\n  + Khi giá trị tăng lên: Vượt hẳn qua 22.0% (tức là 20% + 2%) thì mới TẮT (LoAlm = 0).\n- Vùng giữa [78%, 80%] và [20%, 22%] là vùng ghi nhớ trạng thái (Memory zone / Hysteresis band).\n\n3. TẠI SAO DÙNG CHỐT SR (SET-RESET LATCH):\n- Khối chốt SR lưu giữ trạng thái ngõ ra: Khi không có tín hiệu Set và Reset đồng thời, ngõ ra Q giữ nguyên giá trị trước đó (Latching).\n- Trong TIA Portal, khối SR ưu tiên Reset (nếu cả S1 và R cùng kích hoạt, R sẽ thắng) hoặc khối RS ưu tiên Set. Ở đây hai điều kiện X > 80.0% và X < 78.0% là loại trừ lẫn nhau, không bao giờ xảy ra cùng lúc nên hoạt động cực kỳ an toàn.",

            explanationVi: "1. NGUYÊN LÝ TOÁN HỌC CỦA TỐC ĐỘ BIẾN THIÊN (RATE OF CHANGE - ĐẠO HÀM):\n- Tốc độ biến thiên (RoC) chính là đạo hàm bậc nhất của tín hiệu analog theo thời gian:\nFORMULA: RoC(t) ≈ {d y(t)} / {d t} ≈ {y[k] - y[k - 1]} / {Ts}\n- Trong đó:\n  + y[k]: Giá trị tín hiệu ở chu kỳ hiện tại (Current_Val).\n  + y[k - 1]: Giá trị tín hiệu ở chu kỳ lấy mẫu liền trước (Prev_Val).\n  + Ts: Chu kỳ lấy mẫu danh định (Sampling period). Khi Ts = 10 ms, ta có Ts = 0.010 s.\n- Thứ nguyên của RoC là %/s (phần trăm trên một giây).\n- Đề bài sử dụng giá trị tuyệt đối |RoC| > 30.0 %/s vì hiện tượng sốc hay rung động va chạm có thể làm tín hiệu vọt lên đột ngột (đạo hàm dương) hoặc sụt áp đột ngột (đạo hàm âm).\n\n2. TẠI SAO BẮT BUỘC DÙNG KHỐI NGẮT CHU KỲ OB30 (CYCLIC INTERRUPT)?\n- OB1 (Main program cycle) là vòng quét lặp tự do (Free-running cycle). Thời gian quét của OB1 phụ thuộc vào số lượng lệnh đang chạy, tác vụ truyền thông HMI/SCADA, và có thể biến động từ 1 ms đến 5–10 ms (gọi là hiện tượng Scan Time Jitter).\n- Nếu tính toán RoC = (Current - Previous) / 0.010 trong OB1, trong khi thực tế chu kỳ quét bị kéo dài lên 20 ms, thì mẫu số 0.010 sẽ hoàn toàn sai lệch, dẫn tới đạo hàm tính ra bị nhân đôi hoặc méo mó.\n- Ngược lại, OB30 là khối ngắt phần cứng (Hardware Timer Interrupt) với độ chính xác cỡ micro-giây. Cứ đúng 10.0 ms, CPU ngắt chương trình OB1 để ưu tiên thực thi OB30, đảm bảo Ts luôn là một hằng số toán học lý tưởng!\n\n3. THAY ĐỔI CHU KỲ LẤY MẪU (VÍ DỤ TĂNG LÊN Ts = 20 ms):\n- Khi tăng gấp đôi chu kỳ lấy mẫu từ 10 ms lên 20 ms:\n  + Trong cấu hình phần cứng CPU / thuộc tính OB30: Sửa Execution cycle = 20 ms.\n  + Trong công thức tính toán: Phải chia cho 0.020 thay vì 0.010.\nFORMULA: RoC (khi Ts = 20 ms) = {Current - Previous} / {0.020}\n  + Nếu không cập nhật Ts trong công thức, kết quả RoC sẽ bị sai lệch một nửa (50%), dẫn đến hệ thống không cảnh báo đúng ngưỡng.\n\n4. KIỂM CHỨNG THỰC TẾ:\n- Xoay núm biến trở thật chậm: Current - Previous ≈ 0.05% trong 10 ms:\nFORMULA: RoC = {0.05} / {0.010} = 5.0 %/s < 30 %/s → ShockAlm = 0\n- Dùng tay xoay thật nhanh hoặc gõ/lắc biến trở: Current - Previous = 2.0% chỉ trong 10 ms:\nFORMULA: RoC = {2.0} / {0.010} = 200.0 %/s > 30 %/s → ShockAlm = 1",

        function recomputeDerived(skipRoc) {
          var pipe = computeAnalogPipeline(S.voltage);
          S.voltage = pipe.voltage;
          S.rawIW64 = pipe.rawIW64;
          S.normPct = pipe.normPct;
          S.scaleV = pipe.scaleV;
          S.engFilt = pipe.engFilt;

          var clean = evaluateCleanroomHysteresis(S.engFilt, { hiAlm: S.hiAlm, loAlm: S.loAlm });
          S.hiAlm = clean.hiAlm;
          S.loAlm = clean.loAlm;

          S.pumpCmd = evaluateTankPumpHysteresis(S.tankLevel, S.pumpCmd);

          var tz = evaluateTemperatureZone(S.temperature);
          S.qCold = tz.qCold;
          S.qNormal = tz.qNormal;
          S.qHot = tz.qHot;

          if (!skipRoc) {
            var r = computeRoC(S.engFilt, S.prevVal, S.sampleTimeMs);
            S.roc = r.roc;
            if (r.shockAlm) {
              S.shockAlm = true;
              if (S.shockTimer) clearTimeout(S.shockTimer);
              S.shockTimer = setTimeout(function () {
                S.shockAlm = false;
                updateDynamic();
              }, 1500);
            }
            S.prevVal = S.engFilt;
          }

          // Check HMI Alarms if connected
          if (S.plcSimRunning && S.pgPcInterface === 'PLCSIM.TCPIP.1') {
            var nowStr = new Date().toTimeString().split(' ')[0];
            if (S.hiAlm) appendAlarm('HiAlm (%Q0.2)', 'Áp suất/Tín hiệu vượt ngưỡng cao > 80% (' + S.engFilt.toFixed(1) + '%)', 'HIGH', nowStr);
            if (S.loAlm) appendAlarm('LoAlm (%Q0.3)', 'Áp suất/Tín hiệu dưới ngưỡng thấp < 20% (' + S.engFilt.toFixed(1) + '%)', 'LOW', nowStr);
            if (S.shockAlm) appendAlarm('ShockAlm (%Q0.1)', 'Cảnh báo sốc cơ khí! |RoC| = ' + Math.abs(S.roc).toFixed(1) + ' %/s > 30 %/s', 'CRITICAL', nowStr);
          }
        }

        function appendAlarm(tag, msg, sev, ts) {
          for (var i = 0; i < S.alarms.length; i++) {
            if (S.alarms[i].tag === tag && S.alarms[i].status === 'INCOMING') return;
          }
          S.alarms.unshift({ id: Date.now() + Math.floor(Math.random() * 1000), tag: tag, message: msg, severity: sev, timestamp: ts, status: 'INCOMING' });
          if (S.alarms.length > 25) S.alarms.length = 25;
        }

        function setVoltage(v, syncOther) {
          S.voltage = clampVoltage(v);
          if (syncOther && S.syncMode === 'tank') S.tankLevel = Math.round(S.voltage * 100) / 10;
          else if (syncOther && S.syncMode === 'temp') S.temperature = Math.round(S.voltage * 50) / 10;
          recomputeDerived(false);
          updateDynamic();
        }

        function setTankLevel(lvl) {
          S.tankLevel = Math.min(100, Math.max(0, lvl));
          S.voltage = clampVoltage(S.tankLevel / 10);
          recomputeDerived(false);
          updateDynamic();
        }

        function setTemperature(t) {
          S.temperature = Math.min(50, Math.max(0, t));
          S.voltage = clampVoltage(S.temperature / 5);
          recomputeDerived(false);
          updateDynamic();
        }

        function triggerFlickFast() {
          var step = S.voltage > 5.0 ? -4.5 : 4.5;
          var newV = clampVoltage(S.voltage + step);
          var tsSec = S.sampleTimeMs / 1000.0;
          var jumpRoc = ((newV - S.voltage) * 10.0) / tsSec;
          S.voltage = newV;
          recomputeDerived(true);
          S.roc = jumpRoc;
          S.shockAlm = true;
          S.prevVal = S.engFilt;
          if (S.plcSimRunning && S.pgPcInterface === 'PLCSIM.TCPIP.1') {
            appendAlarm('ShockAlm (%Q0.1)', 'Cảnh báo sốc cơ khí! |RoC| = ' + Math.abs(jumpRoc).toFixed(1) + ' %/s > 30 %/s', 'CRITICAL', new Date().toTimeString().split(' ')[0]);
          }
          if (S.shockTimer) clearTimeout(S.shockTimer);
          S.shockTimer = setTimeout(function () {
            S.shockAlm = false;
            S.roc = 0;
            updateDynamic();
          }, 2000);
          updateDynamic();
        }

        // Background Simulation Loops
        setInterval(function () {
          if (S.isAutoSweeping) {
            var next = S.voltage + S.sweepDir * 0.1;
            if (next >= 10.0) { next = 10.0; S.sweepDir = -1; }
            else if (next <= 0.0) { next = 0.0; S.sweepDir = 1; }
            S.voltage = Math.round(next * 10) / 10;
            recomputeDerived(false);
            updateDynamic();
          }
        }, 80);

        setInterval(function () {
          if (S.activeTab === 'tasks' && S.selectedTaskId === 7 && S.taskSubTab === 'sim') {
            var delta = (S.pumpCmd ? 0.8 : 0) - (S.isDraining ? 0.6 : 0);
            if (delta !== 0) {
              var next = Math.min(100, Math.max(0, Math.round((S.tankLevel + delta) * 10) / 10));
              if (next !== S.tankLevel) setTankLevel(next);
            }
          }
        }, 100);

        setInterval(function () {
          if (S.shockRecording) {
            var now = new Date();
            var elapsed = Date.now() - S.shockStartTime;
            var tsSec = S.sampleTimeMs / 1000.0;
            var cur = S.engFilt;
            var prev = S.prevLogVal;
            var absRoc = Math.abs(S.roc);
            S.shockLogCounter += 1;
            S.shockLogs.unshift({
              id: S.shockLogCounter,
              timestamp: now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0'),
              elapsedMs: elapsed,
              currentVal: Math.round(cur * 100) / 100,
              prevVal: Math.round(prev * 100) / 100,
              tsSec: tsSec,

            if (S.shockLogs.length > 200) S.shockLogs.length = 200;

          }

        function setLed(id, dotId, onClass, dotClass, active, txtId, onTxt, offTxt) {
          var el = document.getElementById(id), dt = document.getElementById(dotId);
          if (!el || !dt) return;
          el.className = 'led-card' + (active ? ' ' + onClass : '');
          dt.className = 'dot' + (active ? ' ' + dotClass : '');
          if (txtId) {
            var tx = document.getElementById(txtId);
            if (tx) tx.textContent = active ? onTxt : offTxt;
          }
        }

        function updateSimulationDynamic() {
          var elTs = document.getElementById('sim-ts-lbl');
          if (!elTs) return;
          elTs.textContent = String(S.sampleTimeMs);
          var ai0Dot = document.getElementById('sim-led-ai0');
          if (ai0Dot) ai0Dot.className = 'dot' + (S.voltage > 0.05 ? ' cyan' : '');

          setLed('led-q00', 'dot-q00', 'on-emerald', 'emerald', S.pumpCmd, 'txt-q00', 'BƠM CHẠY', 'DỪNG');
          setLed('led-q01', 'dot-q01', 'on-rose animate-pulse', 'rose', S.shockAlm, 'txt-q01', 'CẢNH BÁO SỐC', 'BÌNH THƯỜNG');
          setLed('led-q02', 'dot-q02', 'on-amber', 'amber', S.hiAlm, 'txt-q02', 'MỨC CAO >80%', 'OFF');
          setLed('led-q03', 'dot-q03', 'on-blue', 'blue', S.loAlm, 'txt-q03', 'MỨC THẤP <20%', 'OFF');
          setLed('led-q10', 'dot-q10', 'on-sky', 'sky', S.qCold);
          setLed('led-q11', 'dot-q11', 'on-emerald', 'emerald', S.qNormal);
          setLed('led-q12', 'dot-q12', 'on-red', 'red', S.qHot);

          var cap = document.getElementById('sim-ctrl-caption');
          var val = document.getElementById('sim-ctrl-val');
          var unit = document.getElementById('sim-ctrl-unit');
          var sld = document.getElementById('sim-master-slider');
          var tMin = document.getElementById('sim-tick-min'), tMid = document.getElementById('sim-tick-mid'), tMax = document.getElementById('sim-tick-max');
          if (S.syncMode === 'pot') {
            cap.textContent = 'Điện áp Ngõ vào AI0 (Terminal 0 - 2M)';
            val.textContent = S.voltage.toFixed(2); unit.textContent = 'V DC';
            sld.max = '10'; sld.value = String(S.voltage);
            tMin.textContent = '0.00 V'; tMid.textContent = '5.00 V (50%)'; tMax.textContent = '10.00 V';
          } else if (S.syncMode === 'tank') {
            cap.textContent = 'Mức nước Bồn chứa (Tank Level)';
            val.textContent = S.tankLevel.toFixed(1); unit.textContent = '%';
            sld.max = '10'; sld.value = String(S.tankLevel / 10);
            tMin.textContent = '0%'; tMid.textContent = '50%'; tMax.textContent = '100%';
          } else {
            cap.textContent = 'Nhiệt độ Môi trường (Chamber Temperature)';
            val.textContent = S.temperature.toFixed(1); unit.textContent = '°C';
            sld.max = '50'; sld.value = String(S.temperature);
            tMin.textContent = '0.0 °C'; tMid.textContent = '25.0 °C'; tMax.textContent = '50.0 °C';
          }

          var btnSweep = document.getElementById('btn-auto-sweep');
          var lblSweep = document.getElementById('lbl-auto-sweep');
          if (btnSweep && lblSweep) {
            btnSweep.className = 'btn flex-1' + (S.isAutoSweeping ? ' btn-amber' : '');
            lblSweep.textContent = S.isAutoSweeping ? 'Dừng Quét Tự động' : 'Quét Chậm 0 ⇄ 100%';
          }

          document.getElementById('pipe-raw').textContent = String(S.rawIW64);
          document.getElementById('pipe-norm').textContent = S.normPct.toFixed(4);
          document.getElementById('pipe-scale').textContent = S.scaleV.toFixed(2) + ' V';
          var pipeRoc = document.getElementById('pipe-roc');
          pipeRoc.textContent = S.roc.toFixed(1) + ' %/s';
          pipeRoc.className = 'font-mono fw-bold tabular-nums nowrap ' + (S.shockAlm ? 'c-rose' : 'c-teal');
          document.getElementById('pipe-roc-box').style.borderColor = S.shockAlm ? 'rgba(244,63,94,.6)' : 'var(--border)';

          document.getElementById('wt-raw').textContent = String(S.rawIW64);
          document.getElementById('wt-norm').textContent = S.normPct.toFixed(4);
          document.getElementById('wt-scale').textContent = S.scaleV.toFixed(2) + ' V';
          document.getElementById('wt-tank').textContent = S.tankLevel.toFixed(1) + ' %';
          document.getElementById('wt-pump').innerHTML = '<span class="badge ' + (S.pumpCmd ? 'badge-emerald' : '') + '">' + (S.pumpCmd ? 'TRUE' : 'FALSE') + '</span>';
          document.getElementById('wt-shock').innerHTML = '<span class="badge ' + (S.shockAlm ? 'badge-rose' : '') + '">' + (S.shockAlm ? 'TRUE' : 'FALSE') + '</span>';
        }

        // =========================================================================
        // LADDER DIAGRAM RENDERER
        // =========================================================================
        function renderLadderBoxHTML(el, powerIn, auxPowerOut) {
          var isBoxHot = el.active ? (powerIn && el.active(S)) : powerIn;
          var enOut = isBoxHot;
          var html = '<div class="lad-box' + (isBoxHot ? ' hot' : '') + '">' +
            '<div class="lad-box-head"><span>' + esc(el.instruction) + '</span>' +
            (el.subLabel ? '<span style="font-size:9px;opacity:.85">' + esc(el.subLabel) + '</span>' : '') + '</div>' +
            '<div style="display:flex;justify-content:space-between;gap:10px;padding:6px 10px">';

          // Left pins
          html += '<div style="display:flex;flex-direction:column;gap:4px">';
          html += '<div style="display:flex;align-items:center;gap:4px"><span class="' + (powerIn ? 'c-emerald' : 'c-dim') + '">EN</span><span class="c-muted">←</span></div>';
          if (el.auxInputs) {
            el.auxInputs.forEach(function (aux, idx) {
              var auxActive = auxPowerOut[idx];
              var inner = aux.elements.map(function (ae) {
                if (ae.kind === 'contact') {
                  var cHot = ae.active(S);
                  return '<span class="badge" style="padding:1px 5px;font-size:9px;' + (cHot ? 'border-color:#34d399;color:#6ee7b7;background:rgba(16,185,129,.15)' : '') + '">' + (ae.variant === 'NO' ? '| |' : '|/|') + ' ' + esc(ae.tag) + '</span>';
                }
                if (ae.kind === 'compare') {
                  var mHot = ae.active(S);
                  return '<span class="badge" style="padding:1px 5px;font-size:9px;' + (mHot ? 'border-color:#34d399;color:#6ee7b7' : '') + '">' + esc(ae.in1 + ' ' + ae.op + ' ' + ae.in2) + '</span>';
                }
                return '';
              }).join('');
              html += '<div style="display:flex;align-items:center;gap:4px;padding-top:3px;border-top:1px solid #1e293b">' +
                '<span class="' + (auxActive ? 'c-emerald fw-bold' : 'c-muted') + '">' + esc(aux.pin) + '</span>' +
                '<span class="c-dim">←</span><div style="display:flex;gap:3px;flex-wrap:wrap">' + inner + '</div></div>';
            });
          }
          el.inputs.forEach(function (inp) {
            var lv = inp.liveValue ? inp.liveValue(S) : null;
            html += '<div style="display:flex;align-items:center;gap:4px">' +
              '<span class="c-dim">' + esc(inp.pin) + '</span>' +
              '<span class="c-dim">:</span>' +
              '<span style="color:#e2e8f0">' + esc(inp.label) + '</span>' +
              (lv && S.ladderMonitorOn ? '<span class="c-cyan fw-bold" style="font-size:9px">[' + esc(lv) + ']</span>' : '') +
              '</div>';
          });
          html += '</div>';

          // Right pins
          html += '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">';
          html += '<div style="display:flex;align-items:center;gap:4px"><span class="c-muted">→</span><span class="' + (enOut ? 'c-emerald fw-bold' : 'c-dim') + '">ENO</span></div>';
          el.outputs.forEach(function (out) {
            var lv = out.liveValue ? out.liveValue(S) : null;
            html += '<div style="display:flex;align-items:center;gap:4px">' +
              (lv && S.ladderMonitorOn ? '<span class="c-teal fw-bold" style="font-size:9px">[' + esc(lv) + ']</span>' : '') +
              '<span style="color:#fde68a">' + esc(out.label) + '</span>' +
              '<span class="c-dim">:</span>' +
              '<span class="c-dim">' + esc(out.pin) + '</span></div>';
          });
          html += '</div></div></div>';
          return html;
        }

        function renderLadderRungHTML(elements, initPower) {
          var p = initPower === undefined ? true : initPower;
          var html = '<div class="lad-rung"><div class="lad-rail' + (p ? ' on' : '') + '"></div>';
          var cur = p;
          for (var i = 0; i < elements.length; i++) {
            var el = elements[i];
            var prev = cur;
            html += '<div class="lad-wire' + (prev ? ' on' : '') + '"></div>';

            if (el.kind === 'contact') {
              var cAct = !!el.active(S);
              cur = prev && cAct;
              html += '<div class="lad-contact">' +
                '<div class="txt-10 font-mono c-white fw-semi" style="max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(el.tag) + '</div>' +
                (el.address ? '<div class="txt-10 font-mono c-cyan">' + esc(el.address) + '</div>' : '') +
                '<div class="lad-contact-box' + (prev && cAct ? ' hot' : (cAct ? ' closed' : '')) + '">' + (el.variant === 'NO' ? '   ' : ' / ') + '</div>' +
                '</div>';
            } else if (el.kind === 'compare') {
              var mAct = !!el.active(S);
              cur = prev && mAct;
              var lr = el.liveReadout ? el.liveReadout(S) : null;
              html += '<div class="lad-cmp' + (cur ? ' hot' : '') + '">' +
                '<div class="txt-10 fw-bold ' + (cur ? 'c-emerald' : 'c-teal') + '" style="text-align:center">' + esc(el.op) + ' (' + esc(el.dataType) + ')</div>' +
                '<div style="margin-top:2px;text-align:center;color:#e2e8f0">' +
                (el.op === 'IN_RANGE'
                  ? esc(el.in1) + ' .. ' + esc(el.in2) + ' .. ' + esc(el.in3)
                  : esc(el.in1) + ' ' + esc(el.op) + ' ' + esc(el.in2)) +
                '</div>' +
                (lr && S.ladderMonitorOn ? '<div class="txt-10 c-cyan fw-bold" style="text-align:center;margin-top:2px">[' + esc(lr) + ']</div>' : '') +
                '</div>';
            } else if (el.kind === 'coil') {
              var oAct = el.active ? !!el.active(S) : prev;
              var hot = prev || oAct;
              var sym = el.variant === 'SET' ? '(S)' : el.variant === 'RESET' ? '(R)' : '( )';
              html += '<div class="lad-coil">' +
                '<div class="txt-10 font-mono c-white fw-semi" style="max-width:115px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(el.tag) + '</div>' +
                (el.address ? '<div class="txt-10 font-mono c-cyan">' + esc(el.address) + '</div>' : '') +
                '<div class="lad-coil-sym' + (hot ? ' hot' : '') + '">' + sym + '</div>' +
                '</div>';
              cur = hot;
            } else if (el.kind === 'box') {
              var auxOut = (el.auxInputs || []).map(function (a) { return evaluateRungFlow(a.elements, S, true); });
              cur = el.active ? (prev && !!el.active(S)) : prev;
              html += renderLadderBoxHTML(el, prev, auxOut);
            } else if (el.kind === 'branch') {
              var branchOut = el.branches.some(function (b) { return evaluateRungFlow(b, S, prev); });
              html += '<div class="lad-branch">';
              el.branches.forEach(function (b) {
                html += '<div style="display:flex;align-items:center">' + renderLadderBranchInner(b, prev) + '</div>';
              });
              html += '</div>';
              cur = branchOut;
            }
          }
          html += '<div class="flex-1 lad-wire full' + (cur ? ' on' : '') + '"></div><div class="lad-rail-r"></div></div>';
          return html;
        }

        function renderLadderBranchInner(elements, prev) {
          var p = prev;
          var html = '';
          for (var i = 0; i < elements.length; i++) {
            var el = elements[i];
            var pv = p;
            if (i > 0) html += '<div class="lad-wire sm' + (pv ? ' on' : '') + '"></div>';
            if (el.kind === 'contact') {
              var act = !!el.active(S);
              p = pv && act;
              html += '<div class="lad-contact"><div class="txt-10 font-mono c-white">' + esc(el.tag) + '</div>' +
                (el.address ? '<div class="txt-10 font-mono c-cyan">' + esc(el.address) + '</div>' : '') +
                '<div class="lad-contact-box' + (pv && act ? ' hot' : (act ? ' closed' : '')) + '">' + (el.variant === 'NO' ? '   ' : ' / ') + '</div></div>';
            } else if (el.kind === 'compare') {
              var mA = !!el.active(S);
              p = pv && mA;
              html += '<div class="lad-cmp' + (p ? ' hot' : '') + '"><div class="txt-10 fw-bold ' + (p ? 'c-emerald' : 'c-teal') + '" style="text-align:center">' + esc(el.op) + '</div><div style="text-align:center">' + esc(el.in1 + ' ' + el.op + ' ' + el.in2) + '</div></div>';
            } else if (el.kind === 'coil') {
              var co = el.active ? !!el.active(S) : pv;
              var hot = pv || co;
              html += '<div class="lad-coil"><div class="txt-10 font-mono c-white">' + esc(el.tag) + '</div>' +
                (el.address ? '<div class="txt-10 font-mono c-cyan">' + esc(el.address) + '</div>' : '') +
                '<div class="lad-coil-sym' + (hot ? ' hot' : '') + '">' + (el.variant === 'SET' ? '(S)' : el.variant === 'RESET' ? '(R)' : '( )') + '</div></div>';
              p = hot;
            }
          }
          return html;
        }

        function renderLadderHTML(program) {
          if (!program) return '';
          var nets = program.networks.map(function (net) {
            var rungsHtml = net.rungs.map(function (r) { return renderLadderRungHTML(r, true); }).join('');
            return '<div class="lad-net">' +
              '<div class="lad-net-head">' +
                '<span class="txt-xs fw-bold c-white font-mono">' + esc(net.title) + '</span>' +
                (net.comment ? '<span class="txt-11 c-muted">// ' + esc(net.comment) + '</span>' : '') +
              '</div>' +
              '<div class="lad-rungs space-y-3">' + rungsHtml + '</div>' +
              '</div>';
          }).join('');

          return '<div class="lad-wrap">' +
            '<div class="code-head flex-wrap">' +
              '<div class="flex items-center gap-2">' +
                '<span class="dot ' + (S.ladderMonitorOn ? 'emerald animate-pulse' : '') + '"></span>' +
                '<span class="txt-xs fw-bold c-white font-mono">Sơ đồ Ladder Logic (LAD) · ' + esc(program.obBlock) + '</span>' +
              '</div>' +
              '<div class="flex flex-wrap items-center gap-2">' +
                '<button type="button" id="btn-lad-monitor" class="btn ' + (S.ladderMonitorOn ? 'btn-emerald' : '') + '">' + icon('eye', 13) + '<span>' + (S.ladderMonitorOn ? 'Monitor: ON' : 'Monitor: OFF') + '</span></button>' +
                '<button type="button" id="btn-copy-lad" class="btn">' + icon('copy', 13) + '<span id="lbl-copy-lad">Sao chép LAD</span></button>' +

              '<span class="flex items-center gap-1_5"><span class="dot emerald"></span>Đường dây xanh: Đang dẫn điện (Power Flow = TRUE)</span>' +
              '<span class="flex items-center gap-1_5"><span class="dot"></span>Đường dây xám: Ngắt mạch (FALSE)</span>' +
              '<span class="c-cyan font-mono">Giá trị [trong ngoặc] cập nhật realtime</span>' +
            '</div>' +

        function bindLadderEvents() {
          var bm = document.getElementById('btn-lad-monitor');
          if (bm) bm.onclick = function () {
            S.ladderMonitorOn = !S.ladderMonitorOn;
            updateLadderHost();
          };
          var bc = document.getElementById('btn-copy-lad');

          var host = document.getElementById('ladder-diagram-host');

        // =========================================================================
        // TASK 10 SHOCK CSV / TXT EXPORT & STREAM TABLE
        // =========================================================================
        function exportShockCSV() {
          var sep = '\n';
          var bom = '\uFEFF';
          var header = ['STT', 'Timestamp', 'Thoi_gian_ms', 'Tin_hieu_hien_tai_Pct', 'Tin_hieu_truoc_Pct', 'Chu_ky_Ts_s', 'RoC_Pct_per_s', 'Abs_RoC_Pct_per_s', 'Canh_bao_ShockAlm'].join(',');
          var ordered = S.shockLogs.slice().reverse();
          var rows = ordered.map(function (r) {
            return [r.id, r.timestamp, r.elapsedMs, r.currentVal.toFixed(2), r.prevVal.toFixed(2), r.tsSec.toFixed(3), r.roc.toFixed(1), r.absRoc.toFixed(1), r.shockAlm ? 'TRUE (SHOCK)' : 'FALSE'].join(',');
          });
          var csv = bom + [header].concat(rows).join(sep);
          var stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
          downloadFile('PLC_Lab3_Task10_Shock_Data_' + stamp + '.csv', csv, 'text/csv;charset=utf-8;');
        }

        function exportShockTXT() {
          var ordered = S.shockLogs.slice().reverse();
          var lines = [
            '==================================================================================================',
            '  HCMUT MECHATRONICS - BÁO CÁO GHI DỮ LIỆU TASK 10: RATE OF CHANGE & SHOCK DETECTION (S7-1200)',
            '==================================================================================================',
            'Ngày xuất báo cáo : ' + new Date().toLocaleString('vi-VN'),
            'Chu kỳ lấy mẫu Ts : ' + S.sampleTimeMs + ' ms (' + (S.sampleTimeMs / 1000).toFixed(3) + ' s)',
            'Ngưỡng sốc cơ khí : |RoC| > 30.0 %/s',
            'Tổng số mẫu ghi   : ' + ordered.length + ' bản ghi',
            'Số lần kích Shock : ' + ordered.filter(function (x) { return x.shockAlm; }).length + ' lần',
            '--------------------------------------------------------------------------------------------------',
            'STT   | Thời gian    | t(ms)   | Val(%) | Prev(%) | Ts(s) | RoC(%/s)  | |RoC|    | ShockAlm (%Q0.1)',
            '--------------------------------------------------------------------------------------------------'
          ];
          ordered.forEach(function (r) {
            var ln = String(r.id).padEnd(5) + ' | ' + r.timestamp.padEnd(12) + ' | ' + String(r.elapsedMs).padEnd(7) + ' | ' +
              r.currentVal.toFixed(2).padStart(6) + ' | ' + r.prevVal.toFixed(2).padStart(7) + ' | ' + r.tsSec.toFixed(3) + ' | ' +
              (r.roc > 0 ? '+' : '') + r.roc.toFixed(1).padStart(8) + ' | ' + r.absRoc.toFixed(1).padStart(8) + ' | ' +
              (r.shockAlm ? 'TRUE  [!] CẢNH BÁO' : 'FALSE');
            lines.push(ln);
          });
          lines.push('==================================================================================================');
          var stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
          downloadFile('PLC_Lab3_Task10_Shock_Report_' + stamp + '.txt', lines.join('\n'), 'text/plain;charset=utf-8;');
        }

        function updateShockLogsUI() {
          var tb = document.getElementById('shock-log-tbody');
          var stC = document.getElementById('shock-stat-count');
          var stS = document.getElementById('shock-stat-shocks');
          var stM = document.getElementById('shock-stat-max');
          if (!tb) return;

          var shockCnt = S.shockLogs.filter(function (l) { return l.shockAlm; }).length;
          var maxR = 0;
          S.shockLogs.forEach(function (l) { if (l.absRoc > maxR) maxR = l.absRoc; });

          if (stC) stC.textContent = String(S.shockLogs.length);
          if (stS) stS.textContent = String(shockCnt);

            tb.innerHTML = '<tr><td colspan="6" style="padding:28px;text-align:center" class="c-dim">Chưa có dữ liệu log. Hãy nhấn "Ghi Dữ Liệu" hoặc nhấn "Kích Sốc (|RoC| > 30%/s)".</td></tr>';
            return;

          tb.innerHTML = S.shockLogs.slice(0, 50).map(function (r) {

        function bindTaskVisualizerEvents(taskId) {
          if (taskId === 7) {
            var sld = document.getElementById('t7-slider');
            if (sld) sld.oninput = function (e) { setTankLevel(parseFloat(e.target.value)); };
            var p25 = document.getElementById('t7-p25');
            if (p25) p25.onclick = function () { setTankLevel(25); };
            var p75 = document.getElementById('t7-p75');
            if (p75) p75.onclick = function () { setTankLevel(75); };
            var drn = document.getElementById('t7-drain');
            if (drn) drn.onclick = function () {
              S.isDraining = !S.isDraining;
              drn.className = 'btn ' + (S.isDraining ? 'btn-sky' : '');
              drn.textContent = S.isDraining ? 'Đang Mở Van Xả (-)' : 'Mô phỏng Mở Van Xả';
            };
          } else if (taskId === 8 || taskId === 9) {
            var c10 = document.getElementById('t8-c10');
            if (c10) c10.onclick = function () { setTemperature(10); };
            var c22 = document.getElementById('t8-c22');
            if (c22) c22.onclick = function () { setTemperature(22); };
            var c35 = document.getElementById('t8-c35');
            if (c35) c35.onclick = function () { setTemperature(35); };
          } else if (taskId === 10) {
            var ts10 = document.getElementById('t10-ts10');
            if (ts10) ts10.onclick = function () { S.sampleTimeMs = 10; recomputeDerived(true); renderTaskDetailBody(); updateDynamic(); };
            var ts20 = document.getElementById('t10-ts20');
            if (ts20) ts20.onclick = function () { S.sampleTimeMs = 20; recomputeDerived(true); renderTaskDetailBody(); updateDynamic(); };
            var flk = document.getElementById('t10-flick');
            if (flk) flk.onclick = triggerFlickFast;
            var sStr = document.getElementById('t10-sub-stream');
            if (sStr) sStr.onclick = function () { S.shockSubTab = 'stream'; renderTaskDetailBody(); updateShockLogsUI(); };
            var sGde = document.getElementById('t10-sub-guide');
            if (sGde) sGde.onclick = function () { S.shockSubTab = 'real_plc_guide'; renderTaskDetailBody(); };
            var recB = document.getElementById('t10-rec-btn');
            if (recB) recB.onclick = function () { S.shockRecording = !S.shockRecording; renderTaskDetailBody(); updateShockLogsUI(); };
            var clrB = document.getElementById('t10-clear-btn');
            if (clrB) clrB.onclick = function () { S.shockLogs = []; S.shockLogCounter = 0; S.shockStartTime = Date.now(); updateShockLogsUI(); };
            var csvB = document.getElementById('t10-csv-btn');
            if (csvB) csvB.onclick = exportShockCSV;
            var txtB = document.getElementById('t10-txt-btn');
            if (txtB) txtB.onclick = exportShockTXT;
            var cpyB = document.getElementById('t10-cpy-btn');
            if (cpyB) cpyB.onclick = function () {
              var txt = 'STT\tTimestamp\tCurrent(%)\tTs(s)\tRoC(%/s)\tShockAlm\n' +
                S.shockLogs.slice().reverse().map(function (r) { return r.id + '\t' + r.timestamp + '\t' + r.currentVal + '\t' + r.tsSec + '\t' + r.roc + '\t' + (r.shockAlm ? 'TRUE' : 'FALSE'); }).join('\n');
              copyText(txt, function () {
                var l = document.getElementById('t10-cpy-lbl');
                if (l) l.textContent = 'Đã chép!';
                setTimeout(function () { if (l) l.textContent = 'Chép bảng'; }, 2000);
              });
            };
            updateShockLogsUI();
          }
        }

        // VIEW 2: 10 TASKS EXPLORER
        function renderTasksView() {
          var root = document.getElementById('view-tasks');
          var pills = LAB_TASKS.map(function (t) {
            return '<button type="button" class="task-pill' + (t.id === S.selectedTaskId ? ' active' : '') + '" data-sel-task="' + t.id + '">' +
              '<span>Task ' + t.id + '</span><span style="opacity:.75;font-size:10px">' + esc(t.learningOutcome) + '</span></button>';
          }).join('');

          root.innerHTML =
            '<div class="space-y-3">' +
              '<div class="flex items-center justify-between"><h2 class="h4 c-muted" style="text-transform:uppercase;letter-spacing:.05em">Chọn Bài Tập Thực Hành (10 Tasks - Lab 3)</h2><span class="txt-xs c-dim font-mono">Click vào từng bài để xem chi tiết</span></div>' +
              '<div class="flex flex-wrap items-center gap-2" id="task-pill-strip">' + pills + '</div>' +
            '</div>' +
            '<div id="task-detail-card" class="card space-y-5"></div>';

          root.querySelectorAll('[data-sel-task]').forEach(function (btn) {
            btn.onclick = function () {
              S.selectedTaskId = parseInt(btn.getAttribute('data-sel-task'), 10);
              root.querySelectorAll('[data-sel-task]').forEach(function (b) {
                b.classList.toggle('active', parseInt(b.getAttribute('data-sel-task'), 10) === S.selectedTaskId);
              });
              renderTaskDetailCard();
              updateDynamic();
            };
          });
          renderTaskDetailCard();
        }

          var card = document.getElementById('task-detail-card');
          if (!card) return;
          var task = LAB_TASKS.filter(function (t) { return t.id === S.selectedTaskId; })[0] || LAB_TASKS[0];
          var subtabs = [

        function updateTasksDynamic() {
          var hdrV = document.getElementById('td-hdr-v');
          if (hdrV) hdrV.textContent = S.voltage.toFixed(2) + ' V (' + S.rawIW64 + ')';
          if (S.activeTab !== 'tasks') return;

          if (S.taskSubTab === 'code' && (S.codeLangView === 'both' || S.codeLangView === 'lad')) {
            updateLadderHost();
            return;
          }
          if (S.taskSubTab !== 'sim') return;

          var id = S.selectedTaskId;
          if (id === 1) {
            var vb = document.getElementById('t1-v-badge'); if (vb) vb.textContent = S.voltage.toFixed(2);
            var wv = document.getElementById('t1-wire-v'); if (wv) wv.textContent = S.voltage.toFixed(1) + ' V';
            var nd = document.getElementById('t1-needle');
            if (nd) {
              var deg = -135 + (S.voltage / 10) * 270;
              var rad = (deg - 90) * Math.PI / 180;
              nd.setAttribute('x2', (295 + 20 * Math.cos(rad)).toFixed(1));
              nd.setAttribute('y2', (128 + 20 * Math.sin(rad)).toFixed(1));
            }
          } else if (id === 3 || id === 4 || id === 5) {
            var eR = document.getElementById('tv-raw'), eN = document.getElementById('tv-norm'), eS = document.getElementById('tv-scale');
            if (eR) eR.textContent = String(S.rawIW64);
            if (eN) eN.textContent = S.normPct.toFixed(4);
            if (eS) eS.textContent = S.scaleV.toFixed(2) + ' V';
          } else if (id === 6) {
            var b6 = document.getElementById('t6-val-badge'), nd6 = document.getElementById('t6-needle');
            if (b6) b6.textContent = 'AI0_ENG_FILT: ' + S.engFilt.toFixed(1) + '%';
            if (nd6) nd6.style.left = 'calc(' + S.engFilt + '% - 2px)';
            var lc = document.getElementById('t6-lo-card'), lb = document.getElementById('t6-lo-badge');
            if (lc && lb) {
              lc.style.borderColor = S.loAlm ? '#3b82f6' : 'var(--border)';

              lb.textContent = S.loAlm ? 'ON (ALARM)' : 'OFF';
            }
            var hc = document.getElementById('t6-hi-card'), hb = document.getElementById('t6-hi-badge');
            if (hc && hb) {
              hc.style.borderColor = S.hiAlm ? '#f59e0b' : 'var(--border)';
              hc.style.background = S.hiAlm ? 'rgba(120,53,15,.3)' : 'var(--bg-0)';
              hb.className = 'badge ' + (S.hiAlm ? 'badge-amber' : '');

            var pb = document.getElementById('t7-pump-badge');
            if (pb) {
              pb.className = 'badge ' + (S.pumpCmd ? 'badge-emerald' : '');

            }
            var wt = document.getElementById('t7-water'), wl = document.getElementById('t7-water-lbl');
            var sv = document.getElementById('t7-slider-val'), sl = document.getElementById('t7-slider');

            var tb8 = document.getElementById('t8-temp-badge');

        // =========================================================================

        function isHmiOnline() {
          return S.plcSimRunning && S.pgPcInterface === 'PLCSIM.TCPIP.1';
        }

        function updateHMITrendSVG() {
          var svg = document.getElementById('hmi-trend-svg');
          if (!svg) return;
          var ptsEng = [], ptsRoc = [];
          var len = S.trendHistory.length;
          for (var i = 0; i < len; i++) {
            var x = (i / Math.max(1, len - 1)) * 400;
            var yE = 100 - Math.min(100, Math.max(0, S.trendHistory[i].engFilt));
            var yR = 100 - Math.min(100, Math.max(0, Math.abs(S.trendHistory[i].roc)));
            ptsEng.push(x.toFixed(1) + ',' + yE.toFixed(1));
            ptsRoc.push(x.toFixed(1) + ',' + yR.toFixed(1));
          }
          var pE = document.getElementById('trend-poly-eng'), pR = document.getElementById('trend-poly-roc');
          if (pE) pE.setAttribute('points', ptsEng.join(' '));
          if (pR) pR.setAttribute('points', ptsRoc.join(' '));
        }

          var tb = document.getElementById('hmi-alarm-tbody');
          var cnt = document.getElementById('hmi-alarm-cnt');
          var actCnt = S.alarms.filter(function (a) { return a.status === 'INCOMING'; }).length;
          if (cnt) cnt.textContent = String(actCnt);
          if (!tb) return;
          if (!S.alarms.length) {
            tb.innerHTML = '<tr><td colspan="4" style="padding:24px;text-align:center" class="c-dim">Hệ thống an toàn — Chưa có cảnh báo phát sinh.</td></tr>';
            return;

          tb.innerHTML = S.alarms.slice(0, 12).map(function (a) {
            var badgeCls = a.status === 'INCOMING' ? 'badge-rose' : 'badge-emerald';

        function updateHMIDynamic() {
          if (S.activeTab !== 'hmi') return;
          var online = isHmiOnline();
          var pill = document.getElementById('hmi-conn-pill');
          var led = document.getElementById('hmi-led-run');
          if (pill) {
            pill.className = 'badge ' + (online ? 'badge-emerald' : 'badge-rose');
            pill.textContent = online ? 'S7ONLINE: Connected' : 'S7ONLINE: Offline (###)';
          }
          if (led) led.className = 'dot ' + (online ? 'emerald' : 'rose');

          document.querySelectorAll('[data-hscreen]').forEach(function (b) {
            b.classList.toggle('active', parseInt(b.getAttribute('data-hscreen'), 10) === S.hmiScreen);
          });

          var rBtn = document.getElementById('sim-run-btn'), rLbl = document.getElementById('sim-run-lbl');
          if (rBtn && rLbl) {
            rBtn.className = 'btn ' + (S.plcSimRunning ? 'btn-emerald' : 'btn-rose');
            rLbl.textContent = S.plcSimRunning ? 'CPU: RUN' : 'CPU: STOP';
          }

          var iwInp = document.getElementById('sim-iw64-input');
          var tkInp = document.getElementById('sim-tank-input');
          var tpInp = document.getElementById('sim-temp-input');
          if (iwInp && document.activeElement !== iwInp) iwInp.value = String(S.rawIW64);
          if (tkInp && document.activeElement !== tkInp) tkInp.value = S.tankLevel.toFixed(1);
          if (tpInp && document.activeElement !== tpInp) tpInp.value = S.temperature.toFixed(1);

          var q00 = document.getElementById('sim-q00'), q01 = document.getElementById('sim-q01'), q02 = document.getElementById('sim-q02'), q03 = document.getElementById('sim-q03');
          if (q00) { q00.textContent = S.pumpCmd ? 'ON' : 'OFF'; q00.className = S.pumpCmd ? 'c-emerald' : 'c-dim'; }
          if (q01) { q01.textContent = S.shockAlm ? 'ALARM' : 'OFF'; q01.className = S.shockAlm ? 'c-rose' : 'c-dim'; }
          if (q02) { q02.textContent = S.hiAlm ? 'ON' : 'OFF'; q02.className = S.hiAlm ? 'c-amber' : 'c-dim'; }
          if (q03) { q03.textContent = S.loAlm ? 'ON' : 'OFF'; q03.className = S.loAlm ? 'c-sky' : 'c-dim'; }

          var actCnt = S.alarms.filter(function (a) { return a.status === 'INCOMING'; }).length;
          var cntEl = document.getElementById('hmi-alarm-cnt');
          if (cntEl) cntEl.textContent = String(actCnt);

          if (!online) return;
          if (S.hmiScreen === 1) {
            var b1 = document.getElementById('hmi-s1-bar'), r1 = document.getElementById('hmi-s1-raw'), v1 = document.getElementById('hmi-s1-volt'), n1 = document.getElementById('hmi-s1-norm'), p1 = document.getElementById('hmi-s1-pct'), sl1 = document.getElementById('hmi-voltage-slider'), sv1 = document.getElementById('hmi-s1-slval');
            if (b1) b1.style.width = (S.voltage * 10) + '%';
            if (r1) r1.textContent = String(S.rawIW64);
            if (v1) v1.textContent = S.scaleV.toFixed(2) + ' V';
            if (n1) n1.textContent = S.normPct.toFixed(4);
            if (p1) p1.textContent = S.engFilt.toFixed(1) + ' %';
            if (sv1) sv1.textContent = S.voltage.toFixed(2) + ' V';
            if (sl1 && document.activeElement !== sl1) sl1.value = String(S.voltage);
          } else if (S.hmiScreen === 2) {
            var t2 = document.getElementById('hmi-s2-tank'), tb2 = document.getElementById('hmi-s2-tankbar'), pm2 = document.getElementById('hmi-s2-pump'), eg2 = document.getElementById('hmi-s2-eng'), hi2 = document.getElementById('hmi-s2-hi'), lo2 = document.getElementById('hmi-s2-lo');
            if (t2) t2.textContent = S.tankLevel.toFixed(1) + ' %';
            if (tb2) tb2.style.width = S.tankLevel + '%';
            if (pm2) { pm2.className = 'badge ' + (S.pumpCmd ? 'badge-emerald' : ''); pm2.textContent = S.pumpCmd ? 'RUNNING' : 'STOPPED'; }
            if (eg2) eg2.textContent = S.engFilt.toFixed(1) + ' %';
            if (hi2) { hi2.className = 'badge ' + (S.hiAlm ? 'badge-amber' : ''); hi2.textContent = S.hiAlm ? 'ALARM' : 'OK'; }
            if (lo2) { lo2.className = 'badge ' + (S.loAlm ? 'badge-sky' : ''); lo2.textContent = S.loAlm ? 'ALARM' : 'OK'; }
          } else if (S.hmiScreen === 3) {
            var c3 = document.getElementById('hmi-s3-cold'), n3 = document.getElementById('hmi-s3-norm'), h3 = document.getElementById('hmi-s3-hot');
            if (c3) { c3.className = 'led-card' + (S.qCold ? ' on-sky' : ''); c3.textContent = 'Q_COLD: ' + (S.qCold ? 'ON' : 'OFF'); }
            if (n3) { n3.className = 'led-card' + (S.qNormal ? ' on-emerald' : ''); n3.textContent = 'Q_NORMAL: ' + (S.qNormal ? 'ON' : 'OFF'); }

          } else if (S.hmiScreen === 4) {
            updateHMIAlarmRows();
          }
        }
